name: Feature request
description: A new capability, or a change to how something works
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        A change to a project's mechanism (its SETUP.md, where it has one, lists what counts: for example the crypto or the payload format) is decided with the maintainer before anyone writes it. Say here what problem it solves, and the review happens on this issue.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - The user's side (encrypting and sending a credential)
        - The agent's side (keys, decrypting, wrappers)
        - Rotation and compromise
        - Stores
        - Platforms (macOS, Windows, phones)
        - Docs
        - Tests and CI
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you think it should work. A diff or exact wording is welcome (CONTRIBUTING.md, license of contributions).
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
