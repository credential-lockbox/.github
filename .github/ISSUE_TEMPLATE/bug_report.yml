name: Bug report
description: Something doesn't work the way the docs say
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **An exploitable security flaw never goes here:** report it privately instead (SECURITY.md).
        Never paste a credential, a private key or a real blob. Use the project's published test keys to reproduce.
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag you downloaded, or the commit you used (`git rev-parse --short HEAD`).
      placeholder: "v1.2.3 or abc1234"
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Which side
      options:
        - The user's side (encrypting and sending a credential)
        - The agent's side (keys, decrypting, wrappers)
        - The store
        - The tests or CI
        - The docs
        - Other
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Android
        - iOS
        - Other (describe below)
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Tool versions
      description: The tools the project uses, as their own `--version` prints them (for example `bash --version | head -1`, `python3 --version`, `age --version`; on Windows, `$PSVersionTable.PSVersion`). A project's setup check, where it has one, prints these and no secret.
      render: shell
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The messages you saw, with anything secret removed.
      render: shell
    validations:
      required: false
